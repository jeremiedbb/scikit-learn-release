name: Publish to PyPI

# Uploads artifacts from an existing "Build sdist and wheels" run, so the
# wheels published to PyPI are the ones that were built and tested, without
# rebuilding between testpypi and pypi.
on:
  workflow_dispatch:
    inputs:
      version:
        description: scikit-learn version to publish
        required: true
        type: string
      target:
        description: Package index to upload to
        required: true
        type: choice
        options: ["testpypi", "pypi"]

run-name: Publish ${{ inputs.version }} to ${{ inputs.target }}

jobs:
  publish:
    name: Upload to ${{ inputs.target }}
    if: github.repository == 'scikit-learn/scikit-learn-release'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/p/scikit-learn' || 'https://test.pypi.org/p/scikit-learn' }}
    permissions:
      actions: read  # list runs and download artifacts
      id-token: write  # mandatory for trusted publishing
    steps:
      - name: Find build run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SKLEARN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sdist="scikit-learn-${SKLEARN_VERSION}.tar.gz"
          for id in $(gh run list --workflow build-wheels.yml --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            rm -rf sdist-check
            if gh run download "$id" -n cibw-sdist -D sdist-check && find sdist-check -name "$sdist" | grep -q .; then
              echo "Using https://github.com/${{ github.repository }}/actions/runs/${id}"
              echo "run_id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No successful build-wheels.yml run with $sdist in the last 20 runs."
          exit 1

      - name: Download sdist and wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
          pattern: cibw-wheels-*

      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          name: cibw-sdist
          path: dist

      - name: View artifacts
        run: |
          echo "Built by https://github.com/${{ github.repository }}/actions/runs/${{ steps.find.outputs.run_id }}"
          ls -l dist

      # Release order: TestPyPI, then tag that sklearn SHA, then PyPI.
      - name: Check tag matches the built commit
        if: inputs.target == 'pypi'
        env:
          SKLEARN_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.find.outputs.run_id }}" -n cibw-sklearn-sha -D build-info
          built=$(tr -d '[:space:]' < build-info/sklearn-sha.txt)
          git clone --depth 1 --branch "$SKLEARN_VERSION" \
            https://github.com/scikit-learn/scikit-learn.git sklearn-tag
          tagged=$(git -C sklearn-tag rev-parse HEAD)
          echo "built=$built"
          echo "tag ${SKLEARN_VERSION}=$tagged"
          if [[ "$built" != "$tagged" ]]; then
            echo "PyPI requires tag ${SKLEARN_VERSION} to point at the commit that produced these artifacts."
            echo "Build from that tag (or 1.Y.X after merge) and publish those wheels instead."
            exit 1
          fi

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true
          attestations: true

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          print-hash: true
          attestations: true
